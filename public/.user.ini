; POLICY-01 upload cap (App\Rules\PdfFile::MAX_KB = 100 MB).
;
; PHP enforces these before Laravel sees the request, so the validation rule is
; only ever as generous as whichever of these is smallest. Both are PHP_INI_PERDIR,
; which is why a .user.ini can set them at all.
;
; post_max_size must exceed upload_max_filesize, and must exceed the SUM of files
; in one request — the tender wizard posts several documents together. The headroom
; below also covers the non-file fields travelling with them.
;
; PHP-FPM and CGI read this file; other SAPIs ignore it. Laravel Cloud, Forge and
; any nginx in front also impose their own body-size limits (nginx defaults to 1 MB
; via client_max_body_size), which have to be raised separately — this file cannot
; do it for them. Verify with a real upload rather than assuming.
upload_max_filesize = 100M
post_max_size = 256M

; A 100 MB upload streams to S3, so the request outlives the usual short timeout.
max_execution_time = 300
max_input_time = 300
